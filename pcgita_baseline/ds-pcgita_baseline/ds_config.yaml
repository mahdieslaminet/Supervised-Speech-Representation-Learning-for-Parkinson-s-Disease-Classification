Selecteddownstream: MLP
SelectedEncodedLayers: -1
MLP:
  outputdim: 2
  hidden_units:
  - 64
  - 64
  nonlinearity: leaky-relu
  dropout_prob: 0.2
dataloader:
  online: false
  num_workers: 0
  batch_size: 10
  sequence_length: 500
  data_path: preprocess/pcgita_full_100spk/folds/
  fs: 16000
runner:
  Max_epoch: 2
  optimizer:
    type: SGD
    lr: 2e-2
    minlr: 2e-3
    upslr_ratio: 0.1
    momentum: 0.0
    loss: CE
