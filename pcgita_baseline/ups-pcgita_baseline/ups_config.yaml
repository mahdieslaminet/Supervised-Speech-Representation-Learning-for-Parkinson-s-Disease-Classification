SelectedAENetwork: AECNNNet
AEMLPNet:
  hidden_size: 100
  hidden_units:
  - 128
  nonlinearity: relu
  dropout_prob: 0.0
AECNNNet:
  hidden_size: 128
  hidden_units:
  - 256
  kernelsize: 3
  poolingsize: 2
  convchannels:
  - 16
  - 32
  - 64
  - 128
  nonlinearity: leaky-relu
  dropout_prob: 0.0
  batchnorm: true
AERNNNet:
  hidden_size: 128
  hidden_units:
  - 256
  RNN_dims:
  - 128
  stacked_layers_nums: 1
  bidirectional: true
  nonlinearity: leaky-relu
  dropout_prob: 0.0
dataloader:
  online: false
  num_workers: 0
  batch_size: 10
  sequence_length: 500
  data_path: preprocess/pcgita_full_100spk/folds/
  fs: 16000
runner:
  Max_epoch: 2
  optimizer:
    type: SGD
    lr: 2e-2
    minlr: 2e-3
    loss: MSE
    momentum: 0.0
